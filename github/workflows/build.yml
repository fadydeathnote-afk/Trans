      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: GameTranslator
        run: gradle assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp GameTranslator/app/build/outputs/apk/debug/app-debug.apk GameTranslator.apk
          gh release create "v${{ github.run_number }}" GameTranslator.apk --repo "${{ github.repository }}" --title "Game Translator ${{ github.run_number }}" --notes "Download GameTranslator.apk and install it."
